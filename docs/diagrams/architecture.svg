<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <rect width="1000" height="560" fill="#06070B"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7D8FB3"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#F0A44C"/>
    </marker>
  </defs>

  <text x="40" y="46" fill="#F0A44C" font-size="13" letter-spacing="3">LANTERNKEEP  ·  REQUEST PATH</text>
  <line x1="40" y1="62" x2="960" y2="62" stroke="#1C2432" stroke-width="1"/>

  <!-- Browser -->
  <rect x="40" y="96" width="250" height="200" fill="#0D1320" stroke="#1C2432"/>
  <text x="60" y="124" fill="#F2ECE2" font-size="14">BROWSER</text>
  <text x="60" y="152" fill="#9D9385" font-size="11">Landing page · GSAP · Lenis</text>
  <text x="60" y="172" fill="#9D9385" font-size="11">Dashboard (Client Component)</text>
  <text x="60" y="192" fill="#9D9385" font-size="11">Canvas particles · Web Audio</text>
  <text x="60" y="220" fill="#7D8FB3" font-size="11">holds: optimistic UI state</text>
  <text x="60" y="240" fill="#C98A7F" font-size="11">holds: no secrets, no rewards</text>
  <text x="60" y="272" fill="#6F7885" font-size="10">anon key only · RLS applies</text>

  <!-- Next -->
  <rect x="375" y="96" width="250" height="200" fill="#0D1320" stroke="#1C2432"/>
  <text x="395" y="124" fill="#F2ECE2" font-size="14">NEXT.JS 16 · VERCEL</text>
  <text x="395" y="152" fill="#9D9385" font-size="11">middleware.ts</text>
  <text x="395" y="170" fill="#6F7885" font-size="10">session refresh · route guard</text>
  <text x="395" y="196" fill="#9D9385" font-size="11">Server Components</text>
  <text x="395" y="214" fill="#6F7885" font-size="10">6 reads in one Promise.all</text>
  <text x="395" y="240" fill="#9D9385" font-size="11">Server Actions · Zod</text>
  <text x="395" y="258" fill="#6F7885" font-size="10">quests · shop · auth</text>
  <text x="395" y="282" fill="#9D9385" font-size="11">Route handler · /auth/signout</text>

  <!-- Supabase -->
  <rect x="710" y="96" width="250" height="200" fill="#0D1320" stroke="#1C2432"/>
  <text x="730" y="124" fill="#F2ECE2" font-size="14">SUPABASE · ap-south-1</text>
  <text x="730" y="152" fill="#9D9385" font-size="11">Auth · email and password</text>
  <text x="730" y="172" fill="#9D9385" font-size="11">Postgres · 7 tables</text>
  <text x="730" y="192" fill="#8FAE93" font-size="11">RLS enabled AND forced</text>
  <text x="730" y="216" fill="#F0A44C" font-size="11">complete_quest()</text>
  <text x="730" y="234" fill="#F0A44C" font-size="11">purchase_item()</text>
  <text x="730" y="252" fill="#6F7885" font-size="10">SECURITY DEFINER · search_path ''</text>
  <text x="730" y="276" fill="#6F7885" font-size="10">append-only: completions, events</text>

  <!-- arrows -->
  <line x1="290" y1="150" x2="368" y2="150" stroke="#7D8FB3" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="296" y="142" fill="#7D8FB3" font-size="10">cookie session</text>
  <line x1="625" y1="150" x2="703" y2="150" stroke="#7D8FB3" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="632" y="142" fill="#7D8FB3" font-size="10">as the user</text>

  <line x1="703" y1="238" x2="625" y2="238" stroke="#F0A44C" stroke-width="1.5" marker-end="url(#g)"/>
  <text x="628" y="230" fill="#F0A44C" font-size="10">rewards</text>
  <line x1="368" y1="238" x2="290" y2="238" stroke="#F0A44C" stroke-width="1.5" marker-end="url(#g)"/>
  <text x="294" y="230" fill="#F0A44C" font-size="10">computed values</text>

  <!-- the rule -->
  <rect x="40" y="344" width="920" height="76" fill="#0B1018" stroke="#3A2A18"/>
  <text x="62" y="374" fill="#F0A44C" font-size="12" letter-spacing="2">THE RULE</text>
  <text x="62" y="398" fill="#F2ECE2" font-size="13">XP, gold, streak, multiplier and level are computed only inside Postgres. No request carries a reward value.</text>

  <!-- write path -->
  <text x="40" y="462" fill="#9D9385" font-size="12" letter-spacing="2">WRITE PATH</text>
  <line x1="40" y1="474" x2="960" y2="474" stroke="#1C2432"/>

  <text x="40" y="502" fill="#6F7885" font-size="11">click</text>
  <text x="120" y="502" fill="#9D9385" font-size="11">Server Action</text>
  <text x="260" y="502" fill="#9D9385" font-size="11">rpc(complete_quest, id)</text>
  <text x="470" y="502" fill="#8FAE93" font-size="11">lock profile FOR UPDATE</text>
  <text x="690" y="502" fill="#F0A44C" font-size="11">derive reward</text>
  <text x="830" y="502" fill="#9D9385" font-size="11">append history</text>

  <line x1="78" y1="497" x2="112" y2="497" stroke="#2A3444" marker-end="url(#a)"/>
  <line x1="228" y1="497" x2="252" y2="497" stroke="#2A3444" marker-end="url(#a)"/>
  <line x1="428" y1="497" x2="462" y2="497" stroke="#2A3444" marker-end="url(#a)"/>
  <line x1="648" y1="497" x2="682" y2="497" stroke="#2A3444" marker-end="url(#a)"/>
  <line x1="790" y1="497" x2="822" y2="497" stroke="#2A3444" marker-end="url(#a)"/>

  <text x="40" y="532" fill="#6F7885" font-size="10">The only client input is a quest id. Everything to the right of it is server side.</text>
</svg>
